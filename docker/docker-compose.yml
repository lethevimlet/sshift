services:
  sshift:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/lethevimlet/sshift:${VERSION:-latest}
    container_name: sshift
    ports:
      - "${PORT:-8022}:8022"
    environment:
      - NODE_ENV=production
      - PORT=8022
      - BIND=0.0.0.0
      # All persistent state (config.json incl. bookmarks/folders/settings,
      # plus self-signed certificates) is written under this directory.
      # Mount a volume here or data is lost when the container is recreated
      # (e.g. on image updates). NOTE: previous releases mounted /app/config
      # and /app/data — paths the app never wrote to, so nothing actually
      # persisted.
      - SSHIFT_DATA_DIR=/data
    volumes:
      - sshift-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:8022/', {rejectUnauthorized: false}, (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

volumes:
  sshift-data:
    driver: local